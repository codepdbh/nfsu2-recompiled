plugins { id 'com.android.application' }

// Game files bundled into the APK: -PnfsGameData=DIR or nfs.gameData=DIR in local.properties.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) localPropsFile.withInputStream { localProps.load(it) }
def gameData = project.findProperty('nfsGameData') ?: localProps.getProperty('nfs.gameData')
def gameAssets = layout.buildDirectory.dir('game-assets').get().asFile
// Build start time, shown next to the version in the launcher and in diagnostics.
def buildStamp = new Date().format('yyyy-MM-dd_HH:mm')

android {
    namespace 'com.nfsu2.androidevolved'
    compileSdk 35
    if (file('../../src/recomp/gen').exists()) {
        ndkVersion '28.2.13676358'
    }
    defaultConfig {
        applicationId 'com.nfsu2.androidevolved'
        minSdk 29
        targetSdk 35
        versionCode 26
        versionName '0.14.11'
        resValue 'string', 'build_date', buildStamp
        // -PnfsAbi=armeabi-v7a builds the separate 32-bit APK.
        ndk { abiFilters(project.findProperty('nfsAbi') ?: 'arm64-v8a') }
        if (file('../../src/recomp/gen').exists()) {
            externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
        }
    }
    if (file('../../src/recomp/gen').exists()) {
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
    }
    if (gameData) {
        sourceSets { main { assets.srcDir gameAssets } }
        // Stored, not deflated: the launcher streams ~1.8 GB out on first run.
        androidResources { noCompress '' }
    }
    // adrenotools opens its namespace hook libraries by path from nativeLibraryDir.
    packaging { jniLibs { useLegacyPackaging true } }
    // ':' is not allowed in Windows file names.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "NFSU2-AndroidEvolved-${variant.versionName}-${project.findProperty('nfsAbi') ?: 'arm64-v8a'}-${buildStamp.replace(':', '-')}.apk"
        }
    }
}

if (gameData) {
    def syncGameData = tasks.register('syncGameData', Sync) {
        from(gameData) { exclude 'eauninstall.exe', '*.NFO', '*.nfo' }
        into new File(gameAssets, 'nfsu2')
    }
    tasks.named('preBuild') { dependsOn syncGameData }
}
