name: Sync Upstream & Build English APK

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build even if release already exists'
        required: false
        type: boolean
        default: false
      upstream_tag:
        description: 'Specific upstream tag to build (leave empty for latest)'
        required: false
        type: string
        default: ''
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-and-build-english.yml'
      - 'android/**'

concurrency:
  group: sync-build-english-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Query Upstream and Local Releases
        id: release-check
        run: |
          UPSTREAM_TAG="${{ github.event.inputs.upstream_tag }}"
          if [ -z "$UPSTREAM_TAG" ]; then
            UPSTREAM_INFO=$(curl -s https://api.github.com/repos/codepdbh/nfsu2-recompiled/releases/latest)
            UPSTREAM_TAG=$(echo "$UPSTREAM_INFO" | jq -r '.tag_name // empty')
          else
            UPSTREAM_INFO=$(curl -s "https://api.github.com/repos/codepdbh/nfsu2-recompiled/releases/tags/$UPSTREAM_TAG")
          fi

          if [ -z "$UPSTREAM_TAG" ] || [ "$UPSTREAM_TAG" = "null" ]; then
            echo "Error: Could not retrieve upstream release tag."
            exit 1
          fi

          echo "Latest upstream release tag: $UPSTREAM_TAG"
          echo "upstream_tag=$UPSTREAM_TAG" >> "$GITHUB_OUTPUT"

          # Check if our fork already released this tag
          LOCAL_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${UPSTREAM_TAG}-en")
          LOCAL_TAG=$(echo "$LOCAL_RELEASE" | jq -r '.tag_name // empty')

          FORCE_BUILD="${{ github.event.inputs.force_build }}"
          if [ "$LOCAL_TAG" = "${UPSTREAM_TAG}-en" ] && [ "$FORCE_BUILD" != "true" ]; then
            echo "Release ${UPSTREAM_TAG}-en already exists in fork and force_build is not enabled."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release ${UPSTREAM_TAG}-en will be built."
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

          # Extract APK download URLs
          ARM64_URL=$(echo "$UPSTREAM_INFO" | jq -r '.assets[] | select(.name | test("arm64.*\\.apk$")) | .browser_download_url' | head -n 1)
          ARMV7_URL=$(echo "$UPSTREAM_INFO" | jq -r '.assets[] | select(.name | test("armeabi-v7a.*\\.apk$")) | .browser_download_url' | head -n 1)
          UPSTREAM_BODY=$(echo "$UPSTREAM_INFO" | jq -r '.body // ""')

          echo "arm64_url=$ARM64_URL" >> "$GITHUB_OUTPUT"
          echo "armv7_url=$ARMV7_URL" >> "$GITHUB_OUTPUT"
          echo "$UPSTREAM_BODY" > upstream_notes.md

      - name: Set up Java 21
        if: steps.release-check.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK & NDK
        if: steps.release-check.outputs.should_build == 'true'
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.release-check.outputs.should_build == 'true'
        run: |
          sdkmanager --install "ndk;27.0.12077973"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Prepare Signing Keystore
        if: steps.release-check.outputs.should_build == 'true'
        run: |
          if [ -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > release.jks
          else
            keytool -genkeypair -v -keystore release.jks -alias nfsu2 -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "androidrelease" -keypass "androidrelease" \
              -dname "CN=NFSU2 English, OU=Android, O=Recompiled, L=Global, S=Global, C=US"
          fi

      - name: Download Upstream Libraries & Build ARM64 APK
        if: steps.release-check.outputs.should_build == 'true' && steps.release-check.outputs.arm64_url != ''
        run: |
          UPSTREAM_TAG="${{ steps.release-check.outputs.upstream_tag }}"
          ARM64_URL="${{ steps.release-check.outputs.arm64_url }}"

          echo "Downloading upstream ARM64 APK: $ARM64_URL..."
          curl -L "$ARM64_URL" -o upstream_arm64.apk

          echo "Extracting upstream native libraries..."
          unzip -o upstream_arm64.apk "lib/arm64-v8a/*" -d extracted_libs/
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp -f extracted_libs/lib/arm64-v8a/* android/app/src/main/jniLibs/arm64-v8a/

          echo "Compiling registry_sync.cpp for arm64-v8a..."
          $ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
            -shared -fPIC -O2 \
            -std=c++17 \
            -Wall -Wextra \
            -llog \
            -static-libstdc++ \
            android/app/src/main/cpp/registry_sync.cpp \
            -o android/app/src/main/jniLibs/arm64-v8a/libregistry_sync.so

          echo "Building English ARM64 APK with Gradle..."
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cd ..

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android Build Tools in $BUILD_TOOLS_DIR"

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT_APK="NFSU2-AndroidEvolved-${UPSTREAM_TAG}-English-arm64.apk"

          echo "Aligning APK..."
          $BUILD_TOOLS_DIR/zipalign -p -f -v 4 "$UNSIGNED_APK" "$OUT_APK"

          echo "Signing APK..."
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'androidrelease' }}"
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:"$STORE_PASS" --key-pass pass:"$STORE_PASS" "$OUT_APK"

          echo "Verifying APK..."
          $BUILD_TOOLS_DIR/apksigner verify "$OUT_APK"

      - name: Download Upstream Libraries & Build ARMv7 APK (if present)
        if: steps.release-check.outputs.should_build == 'true' && steps.release-check.outputs.armv7_url != ''
        run: |
          UPSTREAM_TAG="${{ steps.release-check.outputs.upstream_tag }}"
          ARMV7_URL="${{ steps.release-check.outputs.armv7_url }}"

          echo "Downloading upstream ARMv7 APK: $ARMV7_URL..."
          curl -L "$ARMV7_URL" -o upstream_armv7.apk

          echo "Extracting upstream ARMv7 native libraries..."
          unzip -o upstream_armv7.apk "lib/armeabi-v7a/*" -d extracted_libs/
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a
          cp -f extracted_libs/lib/armeabi-v7a/* android/app/src/main/jniLibs/armeabi-v7a/

          echo "Building English ARMv7 APK with Gradle..."
          cd android
          ./gradlew assembleRelease -PnfsAbi=armeabi-v7a --no-daemon
          cd ..

          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          OUT_APK="NFSU2-AndroidEvolved-${UPSTREAM_TAG}-English-armeabi-v7a.apk"

          echo "Aligning ARMv7 APK..."
          $BUILD_TOOLS_DIR/zipalign -p -f -v 4 "$UNSIGNED_APK" "$OUT_APK"

          echo "Signing ARMv7 APK..."
          STORE_PASS="${{ secrets.KEYSTORE_PASSWORD || 'androidrelease' }}"
          $BUILD_TOOLS_DIR/apksigner sign --ks release.jks --ks-pass pass:"$STORE_PASS" --key-pass pass:"$STORE_PASS" "$OUT_APK"

          echo "Verifying ARMv7 APK..."
          $BUILD_TOOLS_DIR/apksigner verify "$OUT_APK"

      - name: Generate Checksums and Release Notes
        if: steps.release-check.outputs.should_build == 'true'
        run: |
          UPSTREAM_TAG="${{ steps.release-check.outputs.upstream_tag }}"
          sha256sum NFSU2-AndroidEvolved-*-English-*.apk > "NFSU2-${UPSTREAM_TAG}-English-SHA256SUMS.txt"

          cat << 'EOF' > release_body.md
          ## Need for Speed: Underground 2 Android Evolved (English Translation + Graphics Persistence)

          Automated release synchronized with upstream [codepdbh/nfsu2-recompiled](https://github.com/codepdbh/nfsu2-recompiled).

          ### What's Included in this English Edition:
          - **100% English Localization**:
            - Complete English translation across all launcher settings, options, buttons, and dialogs.
            - In-game language defaults to `English UK` (`LANGUAGES/English.bin`).
            - On-screen touch racing controls editor and HUD translated into English.
            - GPU probe and driver compatibility diagnostics translated into English.
          - **Persistent Graphic Settings**:
            - Built-in `libregistry_sync.so` automatically loads and saves in-game graphics settings (World LOD, Car Reflections, Shadow Detail, Resolution, FSAA, Fog, etc.) to `/sdcard/nfsu2/registry.ini`.
            - Settings survive app restarts and system reboots.
          - **Built-in Self-Updating Fork**:
            - The in-game update checker checks [punitr2007/nfsu2-recompiled](https://github.com/punitr2007/nfsu2-recompiled/releases) for new English builds.
          - **Latest Upstream Optimizations**:
            - Low-latency input handling and Direct3D 9 / Vulkan pipeline caching.

          ### Recommended Settings (Snapdragon 8 Gen 1 / 2 / 3):
          - **Vulkan Driver**: System default or Mesa Turnip driver via `Import ZIP` for Adreno 700 series GPUs.
          - **FPS Limit**: Match your device's refresh rate (e.g. 60 FPS or 120 FPS).
          - **CPU/GPU Sync**: `2 (Performance · CPU and GPU in parallel)`.
          - **Internal Resolution**: 75% or Native.

          ### Downloads & Checksums:
          Install the APK below over your existing app to retain all career progress and settings.
          EOF

      - name: Publish GitHub Release
        if: steps.release-check.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ steps.release-check.outputs.upstream_tag }}-en"
          name: "NFSU2 Android Evolved ${{ steps.release-check.outputs.upstream_tag }} (English Translation)"
          body_path: release_body.md
          files: |
            NFSU2-AndroidEvolved-*-English-arm64.apk
            NFSU2-AndroidEvolved-*-English-armeabi-v7a.apk
            NFSU2-*-English-SHA256SUMS.txt
          draft: false
          prerelease: false
